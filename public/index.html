<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — معارف هرات</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #0056b3, #003d82);
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         margin: 0; padding: 20px; }
  .box { background: #fff; padding: 40px 35px; border-radius: 16px; width: 100%;
         max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  h1 { color: #0056b3; text-align: center; font-size: 20px; margin: 0 0 8px; }
  .sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 25px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px;
          margin-bottom: 16px; font-size: 14px; font-family: inherit; }
  input:focus { border-color: #0056b3; outline: none; }
  button { width: 100%; padding: 14px; background: #0056b3; color: #fff; border: none;
           border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #003d82; }
  .err { color: #dc2626; text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hint { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e;
          padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; line-height: 1.7; }
  code { background: #fff; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<form class="box" id="loginForm">
  <h1>🏫 ریاست معارف ولایت هرات</h1>
  <div class="sub">سیستم دیجیتالی جمع‌آوری معلومات کارمندان</div>

  <div class="hint">
    🔑 <b>ادمین:</b> <code>admin</code> / <code>admin123</code><br>
    🏫 <b>مکتب:</b> نام کاربری + رمزی که ادمین داده
  </div>

  <label>نام کاربری</label>
  <input id="username" required autocomplete="username">

  <label>رمز عبور</label>
  <input id="password" type="password" required autocomplete="current-password">

  <button type="submit">ورود</button>
  <div class="err" id="err"></div>
</form>

<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'در حال ورود...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'خطا');
    location.href = data.user.role === 'admin' ? '/admin.html' : '/school.html';
  } catch (err) {
    document.getElementById('err').textContent = '❌ ' + err.message;
    btn.disabled = false; btn.textContent = 'ورود';
  }
});
</script>
</body>
</html>
