<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل اختصاصی مکاتب - هرات</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; direction: rtl; }
        .topbar { background: #10b981; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 25px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 20px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-success { background-color: #10b981; }
        .btn-primary { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; margin-top: 15px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        th { background-color: #f8fafc; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-success { background-color: #dcfce7; color: #15803d; }
        .badge-warning { background-color: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div class="topbar">
        <h3>پنل کاربری مکتب (جمع‌آوری معلومات)</h3>
        <button class="btn" onclick="logout()" style="background-color: #ef4444; padding: 6px 12px; font-size: 12px;">خروج</button>
    </div>

    <div class="container">
        <!-- فرم ثبت جدید -->
        <div class="card">
            <h4 style="margin-top:0; color: #10b981;">➕ ثبت کارمند جدید مکتب</h4>
            <form id="recordForm">
                <input type="text" id="formName" class="form-control" placeholder="نام کارمند" required>
                <input type="text" id="formFatherName" class="form-control" placeholder="نام پدر" required>
                <input type="text" id="formJob" class="form-control" placeholder="وظیفه (مثال: معلم، مدیر، کارکن خدماتی)" required>
                <input type="text" id="formDegree" class="form-control" placeholder="درجه تحصیل (برای معلم و مدیر الزامی)">
                <button type="submit" class="btn btn-success">💾 ذخیره و ارسال به معارف</button>
            </form>
        </div>

        <!-- جدول پرسنل مکتب -->
        <div class="card">
            <h4>📋 لیست کارمندان ارسال شده</h4>
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 جستجو در لیست مکتب..." oninput="loadSchoolRecords()">
            <table>
                <thead>
                    <tr>
                        <th>آی‌دی</th>
                        <th>نام</th>
                        <th>نام پدر</th>
                        <th>وظیفه</th>
                        <th>تحصیلات</th>
                        <th>وضعیت در معارف</th>
                    </tr>
                </thead>
                <tbody id="schoolTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('hr_token');
        if (!token) { location.href = '/'; }

        async function loadSchoolRecords() {
            const search = document.getElementById('searchInput').value;
            const res = await fetch(`/api/records?search=${encodeURIComponent(search)}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const records = await res.json();
            const tbody = document.getElementById('schoolTableBody');
            tbody.innerHTML = '';
            records.forEach(row => {
                const info = row.data || {};
                let statusHtml = row.status === 'approved' ? '<span class="badge badge-success">تایید شده</span>' : '<span class="badge badge-warning">در انتظار تایید</span>';
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.id}</td><td><b>${info.name||'-'}</b></td><td>${info.fatherName||'-'}</td><td>${info.job||'-'}</td><td>${info.degree||'-'}</td><td>${statusHtml}</td>`;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                name: document.getElementById('formName').value,
                fatherName: document.getElementById('formFatherName').value,
                job: document.getElementById('formJob').value,
                degree: document.getElementById('formDegree').value
            };
            const res = await fetch('/api/records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                alert('ثبت شد و در انتظار تایید معارف است.');
                document.getElementById('recordForm').reset();
                loadSchoolRecords();
            } else {
                const data = await res.json();
                alert(data.error);
            }
        });

        function logout() { localStorage.clear(); location.href = '/'; }
        loadSchoolRecords();
    </script>
</body>
</html>
