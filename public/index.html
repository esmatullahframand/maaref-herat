
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">

<title>ورود | سامانه مدیریت معلومات معارف هرات</title>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
window.addEventListener('load', function () {
  if (window.emailjs) {
    emailjs.init("zwl7hPSbD0TEuG65v");
  }
});
</script>

<!-- فونت وزیرمتن -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
  background: linear-gradient(-45deg,#0f172a,#1e3a8a,#0d9488,#0f172a);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  direction: rtl;
  color: #334155;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* کارت اصلی */
.login-card {
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 22px;
  padding: clamp(14px,3vh,32px) clamp(16px,4vw,35px);
  box-shadow: 0 20px 45px rgba(0,0,0,.3);
  width: 100%;
  max-width: 460px;
  text-align: center;
  flex-shrink: 0;
  animation: slideUp .6s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* عنوان‌ها */
.login-card h2 {
  color: #1e3a8a;
  font-size: clamp(18px,3vw,26px);
  font-weight: 800;
  margin-bottom: 5px;
}

.login-card h4 {
  color: #64748b;
  font-size: clamp(12px,2vw,16px);
  font-weight: 500;
  line-height: 1.8;
  margin-bottom: clamp(10px,2vh,22px);
}

/* بخش معرفی */
.welcome-box {
  background: linear-gradient(135deg,#eff6ff,#f0fdf4);
  border: 1px solid #bfdbfe;
  border-radius: 14px;
  padding: clamp(9px,2vh,17px);
  margin-bottom: clamp(10px,2vh,20px);
  box-shadow: inset 0 2px 4px rgba(0,0,0,.02);
}

.welcome-box h3 {
  color: #0284c7;
  font-size: clamp(12px,2vw,17px);
  font-weight: 800;
  margin-bottom: 7px;
  line-height: 1.8;
}

.welcome-box p {
  color: #334155;
  font-size: clamp(12px,1.8vw,15px);
  font-weight: 700;
  margin-bottom: 9px;
}

.developer-box {
  background: #fff;
  border: 1px dashed #bfdbfe;
  border-radius: 10px;
  padding: 9px;
  line-height: 1.9;
}

.developer-title {
  color: #64748b;
  font-size: 12px;
  font-weight: 600;
}

.developer-name {
  color: #1e3a8a;
  font-size: clamp(15px,2.3vw,19px);
  font-weight: 800;
}

.developer-job {
  color: #475569;
  font-size: clamp(10px,1.6vw,13px);
  font-weight: 500;
}

/* فرم */
.form-group {
  text-align: right;
  margin-bottom: clamp(9px,1.8vh,17px);
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: clamp(12px,1.8vw,16px);
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 5px;
}

.form-control {
  width: 100%;
  padding: clamp(9px,1.7vh,14px) 13px;
  background: #f8fafc;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  font-size: clamp(13px,1.8vw,16px);
  outline: none;
  font-family: 'Vazirmatn',sans-serif;
  color: #0f172a;
  transition: .2s;
}

.form-control:focus {
  background: white;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}

.form-control::placeholder {
  color: #94a3b8;
}

/* کد امنیتی */
.captcha-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  background: #f1f5f9;
  padding: 6px;
  border-radius: 10px;
  width: 100%;
}

.captcha-canvas {
  background: white;
  border: 2px solid #e2e8f0;
  border-radius: 7px;
  cursor: pointer;
  height: 48px;
  flex: 1;
  min-width: 0;
  width: 100%;
}

.captcha-refresh {
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 7px;
  width: 48px;
  height: 48px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  transition: .3s;
}

.captcha-refresh:hover {
  background: #2563eb;
  transform: rotate(180deg);
}

.captcha-hint {
  font-size: clamp(10px,1.6vw,13px);
  color: #64748b;
  text-align: right;
  margin-top: 5px;
}

/* دکمه ورود */
.btn {
  padding: clamp(10px,2vh,15px);
  border: none;
  border-radius: 10px;
  font-weight: 800;
  cursor: pointer;
  font-size: clamp(14px,2vw,18px);
  width: 100%;
  background: linear-gradient(135deg,#1e3a8a,#3b82f6);
  color: white;
  font-family: 'Vazirmatn',sans-serif;
  margin-top: 5px;
  box-shadow: 0 7px 14px rgba(59,130,246,.25);
  transition: .3s;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 18px rgba(59,130,246,.3);
}

.btn:disabled {
  background: #94a3b8;
  cursor: not-allowed;
  box-shadow: none;
}

/* پیام خطا */
.error-box {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  border-radius: 10px;
  padding: 9px;
  margin-bottom: 12px;
  font-size: 13px;
  font-weight: 600;
  display: none;
  text-align: right;
}

/* موبایل */
@media (max-width:600px) {
  body {
    padding: 8px;
  }

  .login-card {
    max-width: 430px;
    border-radius: 17px;
    padding: 15px 14px;
  }

  .captcha-canvas {
    height: 45px;
  }

  .captcha-refresh {
    width: 45px;
    height: 45px;
  }
}

/* صفحه‌های کوتاه */
@media (max-height:700px) {
  body {
    padding: 6px;
  }

  .login-card {
    padding-top: 9px;
    padding-bottom: 9px;
  }

  .login-card h4 {
    margin-bottom: 9px;
  }

  .welcome-box {
    padding: 8px;
    margin-bottom: 9px;
  }

  .form-group {
    margin-bottom: 8px;
  }

  .form-control {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .captcha-canvas,
  .captcha-refresh {
    height: 40px;
  }

  .btn {
    padding: 9px;
  }
}

/* موبایل کوچک */
@media (max-width:360px) {
  .login-card {
    padding: 12px 10px;
  }

  .login-card h2 {
    font-size: 17px;
  }

  .welcome-box h3 {
    font-size: 12px;
  }

  .form-control {
    font-size: 12px;
  }
}

/* کاهش حرکت */
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="login-card">

  <h2>ریاست معارف ولایت هرات</h2>

  <h4>سامانه دیجیتالی مدیریت معلومات کارمندان</h4>

  <div class="welcome-box">

    <h3>✨ به سامانه مدیریت معلومات خوش آمدید ✨</h3>

    <p>آمریت معارف رباط‌سنگی</p>

    <div class="developer-box">

      <div class="developer-title">
        طراحی و توسعه سیستم
      </div>

      <div class="developer-name">
        عصمت‌الله فرهمند
      </div>

      <div class="developer-job">
        عضو مسلکی امور مالی و کارکنان
      </div>

    </div>

  </div>

  <div id="errorBox" class="error-box" role="alert"></div>

  <form id="loginForm" autocomplete="on">

    <div class="form-group">
      <label for="username">نام کاربری</label>

      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        required
        placeholder="نام کاربری خود را وارد کنید"
        autocomplete="username"
      >
    </div>

    <div class="form-group">
      <label for="password">رمز عبور</label>

      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        required
        placeholder="رمز عبور خود را وارد کنید"
        autocomplete="current-password"
      >
    </div>

    <div class="form-group">

      <label for="captchaAnswer">🔒 کد امنیتی</label>

      <div class="captcha-wrapper">

        <canvas
          id="captchaCanvas"
          class="captcha-canvas"
          width="200"
          height="50"
          role="img"
          aria-label="سوال محاسباتی امنیتی"
        ></canvas>

        <button
          type="button"
          class="captcha-refresh"
          id="captchaRefresh"
          aria-label="تغییر سوال امنیتی"
          title="تغییر سوال"
        >🔄</button>

      </div>

      <input
        type="text"
        id="captchaAnswer"
        class="form-control"
        required
        placeholder="پاسخ سوال را وارد کنید"
        autocomplete="off"
        inputmode="numeric"
      >

      <div class="captcha-hint">
        🔍 برای تغییر سوال، روی تصویر یا 🔄 کلیک کنید
      </div>

    </div>

    <button type="submit" id="submitBtn" class="btn">
      ورود به سیستم
    </button>

  </form>

</div>

<script>
'use strict';

const loginForm = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const errorBox = document.getElementById('errorBox');
const captchaCanvas = document.getElementById('captchaCanvas');
const captchaRefresh = document.getElementById('captchaRefresh');
const captchaAnswer = document.getElementById('captchaAnswer');

let captchaCorrectAnswer = null;
let loginInProgress = false;

/* نمایش پیام خطا */
function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = 'block';
  submitBtn.disabled = false;
  submitBtn.innerText = 'ورود به سیستم';
  loginInProgress = false;
}

/* ساخت کد امنیتی */
function generateCaptcha() {

  const ops = ['+', '-', '×'];
  const op = ops[Math.floor(Math.random() * ops.length)];

  let a, b, answer;

  if (op === '+') {

    a = Math.floor(Math.random() * 20) + 5;
    b = Math.floor(Math.random() * 20) + 5;
    answer = a + b;

  } else if (op === '-') {

    a = Math.floor(Math.random() * 20) + 15;
    b = Math.floor(Math.random() * 10) + 2;
    answer = a - b;

  } else {

    a = Math.floor(Math.random() * 8) + 2;
    b = Math.floor(Math.random() * 8) + 2;
    answer = a * b;

  }

  captchaCorrectAnswer = answer;

  const ctx = captchaCanvas.getContext('2d');
  const w = captchaCanvas.width;
  const h = captchaCanvas.height;

  ctx.clearRect(0,0,w,h);

  const gradient = ctx.createLinearGradient(0,0,w,h);

  gradient.addColorStop(0,'#f1f5f9');
  gradient.addColorStop(1,'#e2e8f0');

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,w,h);

  /* خطوط مزاحم */
  for (let i=0; i<5; i++) {

    ctx.strokeStyle =
      `rgba(${Math.random()*200},${Math.random()*200},${Math.random()*200},0.4)`;

    ctx.lineWidth = 1 + Math.random()*2;

    ctx.beginPath();
    ctx.moveTo(Math.random()*w,Math.random()*h);
    ctx.lineTo(Math.random()*w,Math.random()*h);
    ctx.stroke();

  }

  /* نقاط مزاحم */
  for (let i=0; i<30; i++) {

    ctx.fillStyle =
      `rgba(${Math.random()*200},${Math.random()*200},${Math.random()*200},0.5)`;

    ctx.beginPath();

    ctx.arc(
      Math.random()*w,
      Math.random()*h,
      Math.random()*2,
      0,
      2*Math.PI
    );

    ctx.fill();

  }

  ctx.font = 'bold 26px Tahoma';
  ctx.fillStyle = '#1e293b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillText(`${a} ${op} ${b} = ?`,w/2,h/2);

  ctx.strokeStyle = 'rgba(239,68,68,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10,h-10);
  ctx.lineTo(w-10,10);
  ctx.stroke();

  captchaAnswer.value = '';

}

/* تغییر سوال امنیتی */
captchaCanvas.addEventListener('click',generateCaptcha);
captchaRefresh.addEventListener('click',generateCaptcha);

/* شروع اولیه */
generateCaptcha();

/* ورود */
loginForm.addEventListener('submit',async function(e) {

  e.preventDefault();

  if (loginInProgress) return;

  errorBox.style.display = 'none';

  const answerText = captchaAnswer.value.trim();
  const userAnswer = Number(answerText);

  if (
    answerText === '' ||
    !Number.isFinite(userAnswer) ||
    userAnswer !== captchaCorrectAnswer
  ) {

    showError('❌ کد امنیتی اشتباه است');
    generateCaptcha();
    return;

  }

  const username =
    document.getElementById('username').value.trim();

  const password =
    document.getElementById('password').value;

  if (!username || !password) {
    showError('نام کاربری و رمز عبور را وارد کنید');
    return;
  }

  loginInProgress = true;

  submitBtn.disabled = true;
  submitBtn.innerText = 'در حال بررسی...';

  try {

    /* پاک‌کردن فقط اطلاعات ورود قبلی */
    localStorage.removeItem('hr_token');
    localStorage.removeItem('hr_user');
    localStorage.removeItem('hr_schoolname');
    localStorage.removeItem('hr_district');

    const res = await fetch('/api/auth/login', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        username,
        password
      })

    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && data.token) {

      /* ذخیره اطلاعات ورود */
      localStorage.setItem('hr_token',data.token);

      localStorage.setItem(
        'hr_user',
        JSON.stringify(data.user || {})
      );

      if (data.user && data.user.schoolname) {

        localStorage.setItem(
          'hr_schoolname',
          data.user.schoolname
        );

      }

      if (data.user && data.user.district) {

        localStorage.setItem(
          'hr_district',
          data.user.district
        );

      }

      /* اطلاع‌رسانی ایمیلی */
      try {

        if (window.emailjs) {

          const now = new Date();

          const timeStr = now.toLocaleString('fa-IR',{
            timeZone: 'Asia/Kabul'
          });

          await Promise.race([

            emailjs.send(
              'service_9aqrddc',
              'template_d70aci6',
              {
                school_name: data.user?.schoolname || 'نامشخص',
                username: data.user?.username || username,
                district: data.user?.district || 'نامشخص',
                login_time: timeStr
              }
            ),

            new Promise((_,reject) => {

              setTimeout(
                () => reject(new Error('Email timeout')),
                5000
              );

            })

          ]);

        }

      } catch(emailError) {

        console.error('خطا در ارسال ایمیل:',emailError);

      }

      /* انتقال به صفحه مربوطه */
      const redirectTo =
        data.redirect ||
        (
          data.user?.role === 'admin'
            ? '/admin-main.html'
            : '/school-settings.html'
        );

      window.location.href = redirectTo;

    } else {

      localStorage.removeItem('hr_token');
      localStorage.removeItem('hr_user');
      localStorage.removeItem('hr_schoolname');
      localStorage.removeItem('hr_district');

      showError(
        data.error || 'نام کاربری یا رمز عبور اشتباه است'
      );

      generateCaptcha();

    }

  } catch(err) {

    console.error('خطای ورود:',err);

    localStorage.removeItem('hr_token');
    localStorage.removeItem('hr_user');
    localStorage.removeItem('hr_schoolname');
    localStorage.removeItem('hr_district');

    showError('خطا در ارتباط با سرور؛ لطفاً دوباره تلاش کنید');

    generateCaptcha();

  }

});
</script>

</body>
</html>
