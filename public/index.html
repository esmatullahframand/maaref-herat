<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود - معارف هرات</title>
<!-- ═══════════════════════════════════════════════════════════ -->
<!-- اسکریپت EmailJS برای ارسال ایمیل ورود -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // کلید عمومی شما (Public Key)
  emailjs.init("zwl7hPSbD0TEuG65v"); 
</script>

<!-- لود کردن فونت زیبای وزیرمتن برای ظاهر مدرن -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  /* ═══════════════════════════════════════════════ */
  /* تنظیمات پایه و تطبیق‌پذیری کامل */
  /* ═══════════════════════════════════════════════ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Vazirmatn', Tahoma, Arial, sans-serif; 
    
    /* پس‌زمینه گرادیانت متحرک */
    background: linear-gradient(-45deg, #0f172a, #1e3a8a, #0d9488, #0f172a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    
    /* وسط‌چین کردن دقیق */
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh;
    min-height: 100dvh; 
    width: 100%;
    padding: 15px; 
    overflow-x: hidden;
    direction: rtl; 
    color: #334155;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ═══════════════════════════════════════════════ */
  /* کارت اصلی */
  /* ═══════════════════════════════════════════════ */
  .login-card { 
    background: rgba(255, 255, 255, 0.96); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 24px; 
    padding: clamp(25px, 5vw, 45px) clamp(20px, 4vw, 35px); 
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); 
    width: 100%; 
    max-width: 460px; /* کمی پهن‌تر برای جا دادن نوشته‌های بزرگ‌تر */
    text-align: center; 
    animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    flex-shrink: 0;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ═══════════════════════════════════════════════ */
  /* هدر و عناوین (بزرگ‌تر شده) */
  /* ═══════════════════════════════════════════════ */
  .login-card h2 { 
    color: #1e3a8a; 
    font-size: clamp(22px, 4.5vw, 26px); /* بزرگ‌تر */
    font-weight: 800; 
    letter-spacing: -0.5px;
    margin-bottom: 6px; 
  }
  
  .login-card h4 { 
    color: #64748b; 
    font-size: clamp(14px, 2.5vw, 16px); /* بزرگ‌تر */
    font-weight: 500;
    margin-bottom: 25px; 
  }

  /* ═══════════════════════════════════════════════ */
  /* باکس خوش‌آمدگویی و معرفی (بزرگ‌تر شده) */
  /* ═══════════════════════════════════════════════ */
  .welcome-box {
    background: linear-gradient(135deg, #eff6ff, #f0fdf4);
    border: 1px solid #bfdbfe;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 25px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }

  .welcome-box h3 { 
    color: #0284c7; 
    font-size: clamp(15px, 3vw, 17px); 
    font-weight: 800; 
    margin-bottom: 8px; 
  }
  
  .welcome-box p { 
    color: #334155; 
    font-size: clamp(14px, 2.5vw, 15px); 
    font-weight: 700; 
    margin-bottom: 10px; 
  }
  
  .welcome-box span { 
    display: block; 
    color: #475569; 
    font-size: clamp(12px, 2vw, 13px); 
    background: #fff; 
    padding: 8px 12px; 
    border-radius: 8px; 
    border: 1px dashed #cbd5e1;
    line-height: 1.8;
    font-weight: 500;
  }

  /* ═══════════════════════════════════════════════ */
  /* فیلدهای فرم (بزرگ‌تر شده) */
  /* ═══════════════════════════════════════════════ */
  .form-group { 
    text-align: right; 
    margin-bottom: 18px; 
    display: flex; 
    flex-direction: column; 
  }

  .form-group label { 
    font-size: clamp(14px, 2.5vw, 16px); /* بزرگ‌تر */
    font-weight: 700; 
    color: #1e293b; 
    margin-bottom: 8px; 
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-control { 
    width: 100%; 
    padding: 14px 16px; /* افزایش پدینگ */
    background: #f8fafc;
    border: 2px solid #e2e8f0; 
    border-radius: 12px; 
    font-size: clamp(15px, 2.5vw, 16px); /* بزرگ‌تر */
    outline: none; 
    font-family: 'Vazirmatn', sans-serif; 
    transition: all 0.3s ease;
    color: #0f172a;
  }

  .form-control::placeholder { color: #94a3b8; font-weight: 400; }

  .form-control:focus { 
    background: #ffffff;
    border-color: #3b82f6; 
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); 
  }

  /* ═══════════════════════════════════════════════ */
  /* بخش کد امنیتی */
  /* ═══════════════════════════════════════════════ */
  .captcha-wrapper { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    margin-bottom: 12px; 
    background: #f1f5f9;
    padding: 8px;
    border-radius: 12px;
    width: 100%;
  }

  .captcha-canvas { 
    background: #fff; 
    border: 2px solid #e2e8f0; 
    border-radius: 8px; 
    cursor: pointer; 
    user-select: none; 
    height: 55px; /* کمی بلندتر */
    flex-grow: 1; 
    width: 100%;
    max-width: 100%;
    transition: border-color 0.3s;
  }

  .captcha-canvas:hover { border-color: #3b82f6; }

  .captcha-refresh { 
    background: #3b82f6; 
    color: #fff; 
    border: none; 
    border-radius: 8px; 
    width: 55px; 
    height: 55px; 
    font-size: 22px; 
    cursor: pointer; 
    flex-shrink: 0; 
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .captcha-refresh:hover {
    background: #2563eb;
    transform: rotate(180deg);
  }

  .captcha-hint { 
    font-size: clamp(12px, 2vw, 13px); /* بزرگ‌تر */
    color: #64748b; 
    text-align: right; 
    margin-top: 6px; 
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
  }

  /* ═══════════════════════════════════════════════ */
  /* دکمه ارسال و پیام خطا */
  /* ═══════════════════════════════════════════════ */
  .btn { 
    padding: 16px 20px; /* دکمه بلندتر */
    border: none; 
    border-radius: 12px; 
    font-weight: 800; 
    cursor: pointer; 
    font-size: clamp(16px, 3vw, 18px); /* فونت دکمه بزرگ‌تر */
    width: 100%; 
    background: linear-gradient(135deg, #1e3a8a, #3b82f6); 
    color: white; 
    font-family: 'Vazirmatn', sans-serif; 
    transition: all 0.3s ease;
    box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
    margin-top: 10px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 15px 20px -3px rgba(59, 130, 246, 0.4);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:disabled { 
    background: #94a3b8; 
    cursor: not-allowed; 
    box-shadow: none;
    transform: none;
  }

  .error-box { 
    background-color: #fef2f2; 
    border: 1px solid #fecaca; 
    color: #b91c1c; 
    border-radius: 12px; 
    padding: 12px; 
    margin-bottom: 20px; 
    font-size: clamp(13px, 2.5vw, 15px); 
    font-weight: 600;
    text-align: right; 
    display: none; 
    animation: shake 0.5s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
</style>
</head>
<body>

<div class="login-card">
  <h2>ریاست معارف ولایت هرات</h2>
  <h4>سیستم دیجیتالی جمع‌آوری معلومات کارمندان</h4>

  <!-- بخش خوش‌آمدگویی و معرفی -->
  <div class="welcome-box">
    <h3>✨ به دیتابیس آمریت معارف خوش آمدید ✨</h3>
    <p>آمریت معارف رباط سنگی</p>
    <span>
      ترتیب کننده: عصمت الله فرهمند<br>
      (عضو مسلکی امور مالی و کارمندان)
    </span>
  </div>

  <div id="errorBox" class="error-box"></div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label>نام کاربری</label>
      <input type="text" id="username" class="form-control" required placeholder="نام کاربری خود را وارد کنید">
    </div>
    <div class="form-group">
      <label>رمز عبور</label>
      <input type="password" id="password" class="form-control" required placeholder="رمز عبور خود را وارد کنید">
    </div>

    <div class="form-group">
      <label>🔒 کد امنیتی</label>
      <div class="captcha-wrapper">
        <canvas id="captchaCanvas" class="captcha-canvas" width="200" height="50"></canvas>
        <button type="button" class="captcha-refresh" id="captchaRefresh">🔄</button>
      </div>
      <input type="text" id="captchaAnswer" class="form-control" required placeholder="پاسخ سوال را وارد کنید" autocomplete="off" inputmode="numeric">
      <div class="captcha-hint">🔍 برای تغییر سوال، روی تصویر یا 🔄 کلیک کنید</div>
    </div>

    <button type="submit" id="submitBtn" class="btn">ورود به سیستم</button>
  </form>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  const captchaCanvas = document.getElementById('captchaCanvas');
  const captchaRefresh = document.getElementById('captchaRefresh');
  const captchaAnswer = document.getElementById('captchaAnswer');

  let captchaCorrectAnswer = null;

  function generateCaptcha() {
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, answer;

    if (op === '+') { a = Math.floor(Math.random() * 20) + 5; b = Math.floor(Math.random() * 20) + 5; answer = a + b; } 
    else if (op === '-') { a = Math.floor(Math.random() * 20) + 15; b = Math.floor(Math.random() * 10) + 2; answer = a - b; } 
    else { a = Math.floor(Math.random() * 8) + 2; b = Math.floor(Math.random() * 8) + 2; answer = a * b; }

    captchaCorrectAnswer = answer;
    const ctx = captchaCanvas.getContext('2d');
    const w = captchaCanvas.width, h = captchaCanvas.height;

    ctx.clearRect(0, 0, w, h);
    const gradient = ctx.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, '#f1f5f9'); gradient.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(${Math.random()*200}, ${Math.random()*200}, ${Math.random()*200}, 0.4)`;
      ctx.lineWidth = 1 + Math.random() * 2; ctx.beginPath();
      ctx.moveTo(Math.random() * w, Math.random() * h); ctx.lineTo(Math.random() * w, Math.random() * h); ctx.stroke();
    }
    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = `rgba(${Math.random()*200}, ${Math.random()*200}, ${Math.random()*200}, 0.5)`;
      ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 2, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.font = 'bold 26px Tahoma'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${a} ${op} ${b} = ?`, w / 2, h / 2);
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(10, h - 10); ctx.lineTo(w - 10, 10); ctx.stroke();
    captchaAnswer.value = '';
  }

  captchaCanvas.addEventListener('click', generateCaptcha);
  captchaRefresh.addEventListener('click', generateCaptcha);
  generateCaptcha();

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const userAnswer = parseInt(captchaAnswer.value.trim());
    if (isNaN(userAnswer) || userAnswer !== captchaCorrectAnswer) {
      showError('❌ کد امنیتی اشتباه است'); generateCaptcha(); return;
    }
    submitBtn.disabled = true; submitBtn.innerText = 'در حال بررسی...';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      localStorage.clear();
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.token) {
        localStorage.setItem('hr_token', data.token);
        localStorage.setItem('hr_user', JSON.stringify(data.user || {}));
        if (data.user && data.user.schoolname) localStorage.setItem('hr_schoolname', data.user.schoolname);
        if (data.user && data.user.district) localStorage.setItem('hr_district', data.user.district);
        
        // ═══════════════════════════════════════════════════════════
        // ارسال ایمیل به ادمین
        // ═══════════════════════════════════════════════════════════
        try {
          const now = new Date();
          const timeStr = now.toLocaleString('fa-IR');

          await emailjs.send("service_9aqrddc", "template_d70aci6", {
            school_name: data.user.schoolname || 'نامشخص',
            username: data.user.username || 'نامشخص',
            district: data.user.district || 'نامشخص',
            login_time: timeStr
          });
          console.log('✅ ایمیل ورود با موفقیت ارسال شد');
          
          await new Promise(resolve => setTimeout(resolve, 1500)); 
        } catch (emailError) {
          console.error('❌ خطا در ارسال ایمیل:', emailError);
        }

        const redirectTo = data.redirect || (data.user && data.user.role === 'admin' ? '/admin-main.html' : '/school-settings.html');
        window.location.href = redirectTo;
      } else {
        localStorage.clear();
        showError(data.error || 'نام کاربری یا رمز عبور اشتباه است');
        generateCaptcha(); submitBtn.disabled = false; submitBtn.innerText = 'ورود به سیستم';
      }
    } catch (err) {
      localStorage.clear(); showError('خطا در ارتباط با سرور');
      generateCaptcha(); submitBtn.disabled = false; submitBtn.innerText = 'ورود به سیستم';
    }
  });

  function showError(message) {
    errorBox.innerText = message; errorBox.style.display = 'block';
    submitBtn.disabled = false; submitBtn.innerText = 'ورود به سیستم';
  }
</script>
</body>
</html>
