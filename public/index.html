<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود - معارف هرات</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; direction: rtl; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
  .login-card h2 { color: #0056b3; margin-bottom: 5px; font-size: 20px; }
  .login-card h4 { color: #666; margin-bottom: 25px; font-weight: normal; font-size: 14px; }
  .form-group { text-align: right; margin-bottom: 15px; display: flex; flex-direction: column; }
  .form-group label { font-size: 13px; font-weight: bold; color: #4a5568; margin-bottom: 6px; }
  .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; font-family: Tahoma, sans-serif; }
  .form-control:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0,86,179,0.15); }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; width: 100%; background-color: #0056b3; color: white; font-family: Tahoma, sans-serif; }
  .btn:disabled { background-color: #a0aec0; cursor: not-allowed; }
  .error-box { background-color: #fff5f5; border: 1px solid #fed7d7; color: #c53030; border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 13px; text-align: right; display: none; }
  .captcha-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .captcha-canvas { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; user-select: none; flex-shrink: 0; height: 50px; }
  .captcha-refresh { background: #10b981; color: #fff; border: none; border-radius: 8px; width: 50px; height: 50px; font-size: 22px; cursor: pointer; flex-shrink: 0; }
  .captcha-hint { font-size: 11px; color: #64748b; text-align: right; margin-top: 4px; font-style: italic; }
</style>
</head>
<body>

<div class="login-card">
  <h2>ریاست معارف ولایت هرات</h2>
  <h4>سیستم دیجیتالی جمع‌آوری معلومات کارمندان</h4>

  <div id="errorBox" class="error-box"></div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label>نام کاربری</label>
      <input type="text" id="username" class="form-control" required placeholder="نام کاربری">
    </div>
    <div class="form-group">
      <label>رمز عبور</label>
      <input type="password" id="password" class="form-control" required placeholder="رمز عبور">
    </div>

    <div class="form-group">
      <label>🔒 کد امنیتی</label>
      <div class="captcha-wrapper">
        <canvas id="captchaCanvas" class="captcha-canvas" width="200" height="50"></canvas>
        <button type="button" class="captcha-refresh" id="captchaRefresh">🔄</button>
      </div>
      <input type="text" id="captchaAnswer" class="form-control" required placeholder="پاسخ سوال" autocomplete="off" inputmode="numeric">
      <div class="captcha-hint">🔍 برای تغییر سوال، روی تصویر یا 🔄 کلیک کنید</div>
    </div>

    <button type="submit" id="submitBtn" class="btn">ورود به سیستم</button>
  </form>
</div>

<script>
  // ⭐⭐⭐ پاک کردن localStorage در هر بار لود صفحه
  localStorage.clear();
  console.log('🧹 localStorage cleared on page load');

  const loginForm = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  const captchaCanvas = document.getElementById('captchaCanvas');
  const captchaRefresh = document.getElementById('captchaRefresh');
  const captchaAnswer = document.getElementById('captchaAnswer');

  let captchaCorrectAnswer = null;

  function generateCaptcha() {
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, answer;

    if (op === '+') {
      a = Math.floor(Math.random() * 20) + 5;
      b = Math.floor(Math.random() * 20) + 5;
      answer = a + b;
    } else if (op === '-') {
      a = Math.floor(Math.random() * 20) + 15;
      b = Math.floor(Math.random() * 10) + 2;
      answer = a - b;
    } else {
      a = Math.floor(Math.random() * 8) + 2;
      b = Math.floor(Math.random() * 8) + 2;
      answer = a * b;
    }

    captchaCorrectAnswer = answer;

    const ctx = captchaCanvas.getContext('2d');
    const w = captchaCanvas.width;
    const h = captchaCanvas.height;

    ctx.clearRect(0, 0, w, h);
    const gradient = ctx.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, '#f1f5f9');
    gradient.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(${Math.random()*200}, ${Math.random()*200}, ${Math.random()*200}, 0.4)`;
      ctx.lineWidth = 1 + Math.random() * 2;
      ctx.beginPath();
      ctx.moveTo(Math.random() * w, Math.random() * h);
      ctx.lineTo(Math.random() * w, Math.random() * h);
      ctx.stroke();
    }

    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = `rgba(${Math.random()*200}, ${Math.random()*200}, ${Math.random()*200}, 0.5)`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 2, 0, 2 * Math.PI);
      ctx.fill();
    }

    ctx.font = 'bold 26px Tahoma';
    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${a} ${op} ${b} = ?`, w / 2, h / 2);

    ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, h - 10);
    ctx.lineTo(w - 10, 10);
    ctx.stroke();

    captchaAnswer.value = '';
  }

  captchaCanvas.addEventListener('click', generateCaptcha);
  captchaRefresh.addEventListener('click', generateCaptcha);
  generateCaptcha();

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const userAnswer = parseInt(captchaAnswer.value.trim());
    if (isNaN(userAnswer) || userAnswer !== captchaCorrectAnswer) {
      showError('❌ کد امنیتی اشتباه است');
      generateCaptcha();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'در حال بررسی...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      // ⭐ پاک کردن localStorage قبل از لاگین
      localStorage.clear();

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        // ⭐ ذخیره توکن جدید
        localStorage.setItem('hr_token', data.token);
        localStorage.setItem('hr_user', JSON.stringify(data.user || {}));

        if (data.user && data.user.schoolname) {
          localStorage.setItem('hr_schoolname', data.user.schoolname);
        }
        if (data.user && data.user.district) {
          localStorage.setItem('hr_district', data.user.district);
        }

        console.log('✅ Login successful, redirecting...');

        const redirectTo = data.redirect ||
          (data.user && data.user.role === 'admin' ? '/admin.html' : '/school.html');

        window.location.href = redirectTo;
      } else {
        showError(data.error || 'نام کاربری یا رمز عبور اشتباه است');
        generateCaptcha();
      }
    } catch (err) {
      console.error(err);
      showError('خطا در ارتباط با سرور');
      generateCaptcha();
    }
  });

  function showError(message) {
    errorBox.innerText = message;
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.innerText = 'ورود به سیستم';
  }
</script>

</body>
</html>
