<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 15px; }
  .topbar { background: #0056b3; color: #fff; padding: 15px 25px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;

  .topbar h1 { font-size: 17px; margin: 0; }
  .topbar .info { font-size: 13px; opacity: .9; margin-top: 4px; }

  .stat-box.red { background: linear-gradient(135deg, #fee2e2, #fecaca); border-color: #fca5a5; }

  .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;

<script>
// ═══════════════════════════════════════════════
//  API helper
// ═══════════════════════════════════════════════
async function api(url, opts={}) {
  const r = await fetch(url, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401) { location.href = '/'; throw new Error('unauth'); }
  if (r.status === 403) { alert('دسترسی ندارید'); location.href = '/'; throw new Error('forbidden'); }
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || 'خطا');
  return data;
}

// ═══════════════════════════════════════════════
//  تعریف فیلدها
// ═══════════════════════════════════════════════
const FIELDS = [
  { key: 'jobCode', label: 'کُد بست', section: '۱. هویت و اسناد تذکره' },
  { key: 'jobTitle', label: 'عنوان بست', required: true },
  { key: 'firstName', label: 'اسم', required: true },
  { key: 'lastName', label: 'تخلص' },
  { key: 'fatherName', label: 'ولد', required: true },
  { key: 'grandfatherName', label: 'ولدیت', required: true },
  { key: 'eTazkira', label: 'شماره تذکره الکترونیکی', hint: 'اگر دارید وارد کنید' },
  { key: 'paperTazkira', label: 'شماره تذکره کاغذی', hint: 'اگر تذکره برقی ندارید' },
  { key: 'tazkiraPage', label: 'صفحه تذکره' },
  { key: 'tazkiraVolume', label: 'جلد تذکره' },
  { key: 'ethnicity', label: 'قومیت', required: true },

  { key: 'gender', label: 'جنسیت', type: 'select', options: ['', 'مرد', 'زن'], required: true, section: '۲. اطلاعات شخصی و تماس' },
  { key: 'birthDate', label: 'تاریخ تولد (شمسی)', placeholder: '1360/02/22', required: true, hint: 'فرمت: 1360/02/22 یا 22/2/1360' },
  { key: 'birthPlace', label: 'محل تولد' },
  { key: 'originAddress', label: 'سکونت اصلی (ولایت)', required: true },
  { key: 'currentAddress', label: 'سکونت فعلی (ولایت/ناحیه)', required: true },
  { key: 'firstAppointmentDate', label: 'تاریخ اولین تقرر', placeholder: '1385/01/10' },
  { key: 'phone', label: 'شماره تماس', required: true, placeholder: '07XX XXX XXX' },
  { key: 'disability', label: 'دارای معلولیت', type: 'select', options: ['نخیر', 'بلی'] },
  { key: 'positionType', label: 'موقف وظیفوی', type: 'select', options: ['', 'اصلی', 'سرپرستی'] },
  { key: 'employmentType', label: 'نوع استخدام', type: 'select', options: ['', 'حکمی', 'رقابتی'] },

  { key: 'bust', label: 'بست', section: '۳. معلومات وظیفوی و تحصیلی' },
  { key: 'grade', label: 'قدم' },
  { key: 'currentPositionDate', label: 'تاریخ تقرر در وظیفه فعلی', placeholder: '1400/03/20' },
  { key: 'degree', label: 'درجه تحصیلی', placeholder: 'ماستر یا 18', required: true, hint: '18=ماستر، 16=لیسانس، 14=فوق بکلوریا، 12=بکلوریا' },
  { key: 'major', label: 'رشته تعلیمی / تحصیلی', required: true },
  { key: 'eduInstitute', label: 'مرجع تعلیمی / تحصیلی' },
  { key: 'eduInstituteLocation', label: 'موقعیت مرجع تحصیلی' },
  { key: 'enrollmentDate', label: 'تاریخ شمولیت', placeholder: '1395/09/01' },
  { key: 'graduationDate', label: 'تاریخ فراغت', placeholder: '1399/12/15' },
  { key: 'subjectTeaching', label: 'مضمون تدریس' }
];

// ═══════════════════════════════════════════════
//  ساخت فرم داینامیک
// ═══════════════════════════════════════════════
function buildForm(containerId, record = {}) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  let lastSection = '';
  FIELDS.forEach(f => {
    if (f.section && f.section !== lastSection) {
      const t = document.createElement('div');
      t.className = 'section-title';
      t.textContent = f.section;
      grid.appendChild(t);
      lastSection = f.section;
    }
    const div = document.createElement('div');
    div.className = 'form-group';
    const lbl = document.createElement('label');
    lbl.textContent = f.label + (f.required ? ' *' : '');
    div.appendChild(lbl);

    let inp;
    if (f.type === 'select') {
      inp = document.createElement('select');
      f.options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o || 'انتخاب کنید';
        if (record[f.key] === o) opt.selected = true;
        inp.appendChild(opt);
      });
    } else {
      inp = document.createElement('input');
      inp.type = 'text';
      if (f.placeholder) inp.placeholder = f.placeholder;
      if (record[f.key]) inp.value = record[f.key];
    }
    inp.id = containerId + '_' + f.key;
    div.appendChild(inp);

    if (f.hint) {
      const hint = document.createElement('span');
      hint.style.cssText = 'font-size:11px; color:#64748b; margin-top:4px; font-style:italic';
      hint.textContent = f.hint;
      div.appendChild(hint);
    }
    grid.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
//  باز و بسته کردن فرم
// ═══════════════════════════════════════════════
function toggleForm() {
  const card = document.getElementById('formCard');
  const isHidden = card.style.display === 'none';
  card.style.display = isHidden ? 'block' : 'none';
  if (isHidden) {
    buildForm('formFields');
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('formFields_firstName')?.focus();
  }
}

// ═══════════════════════════════════════════════
//  تاریخ و سن
// ═══════════════════════════════════════════════
function normalizeDigits(str) {
  if (!str) return '';
  const p = '۰۱۲۳۴۵۶۷۸۹', a = '٠١٢٣٤٥٦٧٨٩';
  return str.split('').map(ch => {
    let i = p.indexOf(ch); if (i !== -1) return i;
    i = a.indexOf(ch); if (i !== -1) return i;
    return ch;
  }).join('');
}

function parseShamsi(s) {
  if (!s) return null;
  const parts = normalizeDigits(s).replace(/[.\-]/g,'/').split('/').map(x => parseInt(x));
  if (parts.length !== 3 || parts.some(isNaN)) return null;
  let y, m, d;
  if (parts[0] > 1000) { y = parts[0]; m = parts[1]; d = parts[2]; }
  else { d = parts[0]; m = parts[1]; y = parts[2]; }
  if (y < 1300 || y > 1408 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return { y, m, d };
}

function calcAge(birth) {
  const p = parseShamsi(birth);
  if (!p) return { age: '—', status: 'نامشخص', retired: false };
  const now = new Date();
  const gy = now.getFullYear(), gm = now.getMonth() + 1, gd = now.getDate();
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = 979;
  let y2 = gy - 1600;
  const gy2 = (gm > 2) ? y2 + 1 : y2;
  let days = 365*y2 + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
           + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
  jy += 33 * Math.floor(days/12053); days %= 12053;
  jy += 4 * Math.floor(days/1461);  days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1) % 365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? days%31 : (days-186)%30);
  let age = jy - p.y;
  if (jm < p.m || (jm === p.m && jd < p.d)) age--;
  if (age < 0) return { age: '—', status: 'نامشخص', retired: false };
  return { age, status: age >= 65 ? '🎖️ تقاعد' : '✅ فعال', retired: age >= 65 };
}

function normalizeDegree(d) {
  if (!d) return '';
  const map = {
    '18':'ماستر','۱۶':'ماستر','١٨':'ماستر',
    '16':'لیسانس','۱۴':'لیسانس','١٦':'لیسانس',
    '14':'فوق بکلوریا','۱۲':'فوق بکلوریا','١٤':'فوق بکلوریا',
    '12':'بکلوریا','١٢':'بکلوریا'
  };
  const n = normalizeDigits(d.trim());
  return map[n] || d.trim();
}

// ═══════════════════════════════════════════════
//  ذخیره رکورد جدید
// ═══════════════════════════════════════════════
async function saveRecord() {
  const rec = {};
  for (const f of FIELDS) {
    const el = document.getElementById('formFields_' + f.key);
    const val = (el?.value || '').trim();
    if (f.required && !val) {
      alert(`❌ فیلد "${f.label}" الزامی است`);
      el?.focus();
      return;
    }
    rec[f.key] = val;
  }

  if (!rec.eTazkira && !rec.paperTazkira) {
    alert('❌ حداقل یکی از تذکره‌های الکترونیکی یا کاغذی الزامی است');
    document.getElementById('formFields_eTazkira')?.focus();
    return;
  }

  if (!parseShamsi(rec.birthDate)) {
    alert('❌ تاریخ تولد نامعتبر است.\nفرمت صحیح: 1360/02/22 یا 22/2/1360\nمحدوده: ۱۳۰۰ تا ۱۴۰۸');
    document.getElementById('formFields_birthDate')?.focus();
    return;
  }

  rec.degree = normalizeDegree(rec.degree);

  try {
    const btn = event?.target;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ در حال ذخیره...'; }

    await api('/api/records', { method: 'POST', body: rec });

    const st = calcAge(rec.birthDate);
    alert(`✅ معلومات با موفقیت ذخیره شد\n\n👤 نام: ${rec.firstName} ${rec.lastName || ''}\n🎓 درجه: ${rec.degree}\n📅 سن: ${st.age} سال\n📊 وضعیت: ${st.status}`);

    toggleForm();
    await loadRecords();
  } catch (e) {
    alert('❌ خطا در ذخیره: ' + e.message);
  }
}

// ═══════════════════════════════════════════════
//  بارگذاری و نمایش لیست
// ═══════════════════════════════════════════════
let allRecords = [];
let currentUser = null;

async function loadRecords() {
  try {
    allRecords = await api('/api/records');

    // آمار
    let retired = 0, active = 0;
    allRecords.forEach(r => {
      const s = calcAge(r.birthDate);
      if (s.retired) retired++;
      else if (s.age !== '—') active++;
    });
    document.getElementById('totalCount').textContent = allRecords.length;
    document.getElementById('retiredCount').textContent = retired;
    document.getElementById('activeCount').textContent = active;

    renderTable();
  } catch (e) {
    console.error(e);
    alert('خطا در بارگذاری: ' + e.message);
  }
}

const COLS = [
  { key: 'firstName', label: 'اسم' },
  { key: 'lastName', label: 'تخلص' },
  { key: 'fatherName', label: 'ولد' },
  { key: 'jobCode', label: 'کُد بست' },
  { key: 'jobTitle', label: 'عنوان بست' },
  { key: 'degree', label: 'درجه' },
  { key: 'birthDate', label: 'تاریخ تولد' },
  { key: 'gender', label: 'جنسیت' },
  { key: 'phone', label: 'تماس' },
  { key: 'major', label: 'رشته' }
];

function renderTable() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const list = allRecords.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));

  const container = document.getElementById('tableContainer');
  if (list.length === 0) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;font-size:14px">📭 هنوز هیچ کارمندی ثبت نشده است</div>';
    return;
  }

  let html = '<table><thead><tr><th>#</th>';
  COLS.forEach(c => html += `<th>${c.label}</th>`);
  html += '<th>سن</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';

  list.forEach((r, i) => {
    const st = calcAge(r.birthDate);
    const statusBadge = st.retired
      ? '<span class="badge badge-red">🎖️ تقاعد</span>'
      : '<span class="badge badge-green">✅ فعال</span>';
    html += `<tr>
      <td>${i+1}</td>
      ${COLS.map(c => `<td>${r[c.key] || ''}</td>`).join('')}
      <td><b>${st.age}</b></td>
      <td>${statusBadge}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-orange btn-sm" onclick="openEdit(${r.id})" title="ویرایش">✏️</button>
        <button class="btn btn-red btn-sm" onclick="delRecord(${r.id})" title="حذف">🗑️</button>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ═══════════════════════════════════════════════
//  حذف رکورد
// ═══════════════════════════════════════════════
async function delRecord(id) {
  const rec = allRecords.find(r => r.id === id);
  if (!rec) return;
  if (!confirm(`⚠️ حذف "${rec.firstName} ${rec.lastName || ''}"؟\n\nاین عمل غیرقابل بازگشت است.`)) return;
  try {
    await api(`/api/records/${id}`, { method: 'DELETE' });
    await loadRecords();
  } catch (e) { alert('❌ ' + e.message); }
}

// ═══════════════════════════════════════════════
//  ویرایش رکورد
// ═══════════════════════════════════════════════
let editingId = null;

function openEdit(id) {
  const rec = allRecords.find(r => r.id === id);
  if (!rec) return;
  editingId = id;
  buildForm('editFields', rec);
  document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('active');
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  const rec = {};
  for (const f of FIELDS) {
    const el = document.getElementById('editFields_' + f.key);
    const val = (el?.value || '').trim();
    if (f.required && !val) {
      alert(`❌ فیلد "${f.label}" الزامی است`);
      return;
    }
    rec[f.key] = val;
  }
  if (!rec.eTazkira && !rec.paperTazkira) {
    alert('❌ حداقل یکی از تذکره‌ها الزامی است');
    return;
  }
  if (!parseShamsi(rec.birthDate)) {
    alert('❌ تاریخ تولد نامعتبر است');
    return;
  }
  rec.degree = normalizeDegree(rec.degree);

  const original = allRecords.find(r => r.id === editingId);
  rec.schoolName = original.schoolName;
  rec.district = original.district;

  try {
    await api(`/api/records/${editingId}`, { method: 'PUT', body: rec });
    alert('✅ ویرایش با موفقیت ذخیره شد');
    closeEditModal();
    await loadRecords();
  } catch (e) { alert('❌ ' + e.message); }
}

// ═══════════════════════════════════════════════
//  خروجی اکسل
// ═══════════════════════════════════════════════
async function exportToExcel() {
  if (allRecords.length === 0) { alert('رکوردی برای خروجی وجود ندارد'); return; }

  const wb = new ExcelJS.Workbook();
  wb.creator = 'ریاست معارف ولایت هرات';

  const ws = wb.addWorksheet('کارمندان', {
    views: [{ rightToLeft: true, showGridLines: true }],
    pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true }
  });

  // عنوان
  ws.mergeCells('A1:N1');
  ws.getCell('A1').value = `لیست کارمندان — ${currentUser.schoolName || currentUser.username} (ولسوالی: ${currentUser.district || '—'})`;
  ws.getCell('A1').font = { name: 'B Nazanin', size: 14, bold: true };
  ws.getCell('A1').alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(1).height = 30;

  // هدر
  const headers = [
    '#','اسم','تخلص','ولد','ولدیت','کُد بست','عنوان بست','درجه',
    'رشته','تاریخ تولد','سن','وضعیت','تماس','تذکره'
  ];
  const hr = ws.addRow(headers);
  hr.height = 26;
  hr.eachCell(c => {
    c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0056B3' } };
    c.font = { color:{argb:'FFFFFFFF'}, bold:true, name:'B Nazanin', size:11 };
    c.alignment = { horizontal:'center', vertical:'middle' };
    c.border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
  });

  // داده‌ها
  allRecords.forEach((r, i) => {
    const st = calcAge(r.birthDate);
    const row = ws.addRow([
      i+1, r.firstName||'', r.lastName||'', r.fatherName||'', r.grandfatherName||'',
      r.jobCode||'', r.jobTitle||'', r.degree||'', r.major||'',
      r.birthDate||'', st.age, st.status, r.phone||'',
      r.eTazkira || r.paperTazkira || ''
    ]);
    row.eachCell(c => {
      c.font = { name:'B Nazanin', size:10 };
      c.alignment = { horizontal:'center', vertical:'middle' };
      c.border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
    });
  });

  ws.columns.forEach((c, i) => c.width = i === 0 ? 5 : 16);

  const buf = await wb.xlsx.writeBuffer();
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const safeName = (currentUser.schoolName || currentUser.username || 'school').replace(/[\\\/\?\*\[\]:]/g, '_');
  saveAs(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
    `کارمندان_${safeName}_${dateStr}.xlsx`);
}

// ═══════════════════════════════════════════════
//  خروج
// ═══════════════════════════════════════════════
async function logout() {
  try { await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); } catch {}
  location.href = '/';
}

// بستن مودال با کلیک بیرون
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target.id === 'editModal') closeEditModal();
});

// ═══════════════════════════════════════════════
//  شروع
// ═══════════════════════════════════════════════
async function init() {
  try {
    currentUser = await api('/api/auth/me');
    if (currentUser.role !== 'school') { location.href = '/admin.html'; return; }
    document.getElementById('schoolLabel').textContent = currentUser.schoolName || currentUser.username;
    document.getElementById('districtLabel').textContent = currentUser.district || '—';
    await loadRecords();
  } catch (e) {
    console.error(e);
    alert('خطا در بارگذاری صفحه: ' + e.message);
  }
}

init();
</script>
