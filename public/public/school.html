<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مکتب — معارف هرات</title>
<!-- استفاده از استایل های استاندارد و شکیل برای حل مشکل تو در تو شدن صفحه -->
<link href="https://jsdelivr.net" rel="stylesheet">
<link href="https://cloudflare.com" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  @import url('https://googleapis.com');
  body { font-family: 'Vazirmatn', sans-serif; background-color: #f4f6f9; padding: 0; margin: 0; }
  .topbar { background: #0056b3; color: #fff; padding: 15px 25px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .card-custom { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: none; margin-bottom: 25px; }
  .stat-box { background: linear-gradient(135deg, #eef6ff, #dbeafe); border: 1px solid #bcd8f5; border-radius: 10px; padding: 15px; text-align: center; }
  .stat-box b { color: #0056b3; font-size: 24px; display: block; margin-top: 5px; }
  .status-badge { font-size: 12px; padding: 5px 10px; border-radius: 20px; }
  .form-label { font-weight: bold; color: #4a5568; }
</style>
</head>
<body>

<div class="topbar d-flex justify-content-between align-items-center px-4 py-3 bg-primary text-white mb-4">
  <div>
    <h5 class="mb-0 fw-bold">🏫 مکتب: <span id="schoolLabel">...</span></h5>
    <small class="opacity-75">📍 آمریت / ولسوالی: <span id="districtLabel">...</span></small>
  </div>
  <button class="btn btn-light btn-sm fw-bold px-3 text-danger" onclick="logout()"><i class="fa-solid fa-power-off"></i> خروج</button>
</div>

<div class="container-fluid px-4">

  <!-- بخش آمار کارمندان مکتب -->
  <div class="card card-custom">
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="stat-box">📊 کل کارمندان ثبت‌شده <b id="totalCount">0</b></div>
      </div>
      <div class="col-md-4">
        <div class="stat-box" style="background: linear-gradient(135deg, #dcfce7, #bbf7d0); border-color: #86efac;">✅ تأیید شده توسط معارف <b id="approvedCount" style="color: #15803d;">0</b></div>
      </div>
      <div class="col-md-4">
        <div class="stat-box" style="background: linear-gradient(135deg, #fef3c7, #fde68a); border-color: #fcd34d;">⏳ در انتظار تأیید ادمین <b id="pendingCount" style="color: #b45309;">0</b></div>
      </div>
    </div>
    <button class="btn btn-success fw-bold px-4" data-bs-toggle="modal" data-bs-target="#recordModal" onclick="clearForm()"><i class="fa-solid fa-user-plus"></i> اضافه کردن کارمند جدید</button>
  </div>

  <!-- لیست نهایی جدول کارمندان مکتب -->
  <div class="card card-custom">
    <h5 class="text-primary mb-3 fw-bold"><i class="fa-solid fa-list-check"></i> لیست پرسنل و کارمندان مکتب</h5>
    <div class="row g-3 mb-3">
      <div class="col-md-9">
        <input id="searchInput" class="form-control" placeholder="🔍 جستجو در لیست کارمندان..." oninput="loadSchoolRecords()">
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-primary w-100 fw-bold" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> خروجی اکسل مکتب</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle border">
        <thead class="table-light">
          <tr>
            <th>آی‌دی</th>
            <th>نام کارمند</th>
            <th>نام پدر</th>
            <th>وظیفه</th>
            <th>درجه تحصیل</th>
            <th>وضعیت تأیید معارف</th>
            <th class="text-center">عملیات</th>
          </tr>
        </thead>
        <tbody id="schoolTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- مۆدال پنجره‌ای ثبت کارمند جدید برای مکاتب -->
<div class="modal fade" id="recordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" style="border-radius:12px;">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">📝 ثبت معلومات کارمند جدید</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="recordForm">
          <input type="hidden" id="recordId">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">نام کارمند</label>
              <input type="text" id="formName" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">نام پدر</label>
              <input type="text" id="formFatherName" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">وظیفه</label>
              <input type="text" id="formJob" class="form-control" required placeholder="مثال: معلم، مدیر، کارکن خدماتی">
            </div>
            <div class="col-md-6">
              <label class="form-label">درجه تحصیل</label>
              <input type="text" id="formDegree" class="form-control" placeholder="برای معلمان و مدیران حتمی است">
            </div>
            <div class="col-md-6">
              <label class="form-label">رشته تحصیلی</label>
              <input type="text" id="formField" class="form-control">
            </div>
          </div>
          <div class="text-end mt-4">
            <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">انصراف</button>
            <button type="submit" class="btn btn-success px-4">💾 ذخیره معلومات</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
  function getToken() { return localStorage.getItem('hr_token') || document.cookie.replace(/(?:(?:^|.*;\s*)token\s*\=\s*([^;]*).*$)|^.*$/, "$1"); }
  function getUser() {
    try { return JSON.parse(localStorage.getItem('hr_user') || 'null'); } catch { return null; }
  }

  let currentUser = getUser() || { username: 'مکتب معارف', role: 'school', schoolName: 'مکتب مربوطه', district: 'مرکز هرات' };
  
  document.getElementById('schoolLabel').textContent = currentUser.schoolName || currentUser.username;
  document.getElementById('districtLabel').textContent = currentUser.district || '—';

  const recordModal = new bootstrap.Modal(document.getElementById('recordModal'));

  async function loadSchoolRecords() {
    const search = document.getElementById('searchInput').value;
    try {
      const res = await fetch(`/api/records?search=${encodeURIComponent(search)}`);
      const records = await res.json();
      const tbody = document.getElementById('schoolTableBody');
      tbody.innerHTML = '';
      
      let total = 0, approved = 0, pending = 0;

      records.forEach(row => {
        total++;
        if(row.status === 'approved') approved++; else pending++;
        
        const info = row.data || {};
        let statusBadge = row.status === 'approved' ? 
          '<span class="badge bg-success status-badge">✅ تایید شده</span>' : 
          '<span class="badge bg-warning text-dark status-badge">⏳ در انتظار تایید</span>';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td><strong>${info.name || '-'}</strong></td>
          <td>${info.fatherName || '-'}</td>
          <td>${info.job || '-'}</td>
          <td>${info.degree || '-'}</td>
          <td>${statusBadge}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-primary" onclick="openEditModal(${row.id}, ${JSON.stringify(row)})"><i class="fa-solid fa-pen-to-square"></i> ویرایش</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('totalCount').textContent = total;
      document.getElementById('approvedCount').textContent = approved;
      document.getElementById('pendingCount').textContent = pending;
    } catch (err) { console.error(err); }
  }

  document.getElementById('recordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('recordId').value;
    const body = {
      name: document.getElementById('formName').value,
      fatherName: document.getElementById('formFatherName').value,
      job: document.getElementById('formJob').value,
      degree: document.getElementById('formDegree').value,
      field: document.getElementById('formField').value,
      schoolName: currentUser.schoolName,
      district: currentUser.district
    };

    const url = id ? `/api/records/${id}` : '/api/records';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (res.ok) {
      alert('معلومات کارمند با موفقیت ثبت شد و به وضعیت در انتظار تأیید درآمد.');
      recordModal.hide();
      loadSchoolRecords();
    } else { alert(data.error || 'خطا در ثبت اطلاعات'); }
  });

  function openEditModal(id, row) {
    document.getElementById('modalTitle').innerText = '✏️ ویرایش معلومات کارمند';
    document.getElementById('recordId').value = id;
    document.getElementById('formName').value = row.data.name || '';
    document.getElementById('formFatherName').value = row.data.fatherName || '';
    document.getElementById('formJob').value = row.data.job || '';
    document.getElementById('formDegree').value = row.data.degree || '';
